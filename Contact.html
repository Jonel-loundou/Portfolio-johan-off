<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Johan Loundou pour échanger sur ses projets et ses compétences.">
    <title>Johan Loundou — Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
           <a href="index.html">Accueil</a>
            <a href="Biographie.html">Biographie</a>
            <a href="journey.html" >Parcours</a>
            <a href="projects.html">Projets</a>
            <a href="Contact.html"class="active">Contacts</a>
        </nav>
    </header>

    <main>

        <h1>Contact</h1>

        <section>
            <h2>Me contacter</h2>

            <p>
                Vous pouvez me contacter pour échanger autour de mes projets,
                de mon parcours ou de mes compétences.
            </p>

            <form action="https://formspree.io/f/mnppvawo" method="POST">

                <label for="name">Nom</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Votre nom"
                    required
                >

                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Votre adresse e-mail"
                    required
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Écrivez votre message ici..."
                    required
                ></textarea>

                <button type="submit">Envoyer le message</button>

            </form>

        </section>

    </main>

</body>

</html>
